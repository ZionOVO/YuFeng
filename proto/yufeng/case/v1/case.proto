syntax = "proto3";

// 调查案件契约：资产绑定案件及其只追加活动。
package yufeng.case.v1;

import "google/protobuf/timestamp.proto";
import "yufeng/model/v1/model.proto";
import "yufeng/telemetry/v1/telemetry.proto";

option go_package = "yufeng/proto/gen/casev1";

service CaseService {
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  rpc PollCaseActivities(PollCaseActivitiesRequest) returns (PollCaseActivitiesResponse);
  rpc ResolveCase(ResolveCaseRequest) returns (ResolveCaseResponse);
  rpc ReopenCase(ReopenCaseRequest) returns (ReopenCaseResponse);
  rpc RecordCaseFeedback(RecordCaseFeedbackRequest) returns (RecordCaseFeedbackResponse);
}

enum InvestigationCaseState {
  INVESTIGATION_CASE_STATE_UNSPECIFIED = 0;
  INVESTIGATION_CASE_STATE_OPEN = 1;
  INVESTIGATION_CASE_STATE_WAITING_EVIDENCE_APPROVAL = 2;
  INVESTIGATION_CASE_STATE_QUEUED = 3;
  INVESTIGATION_CASE_STATE_INVESTIGATING = 4;
  INVESTIGATION_CASE_STATE_FINDING_READY = 5;
  INVESTIGATION_CASE_STATE_SHADOW_OBSERVING = 6;
  INVESTIGATION_CASE_STATE_RESOLVED = 7;
  INVESTIGATION_CASE_STATE_FAILED = 8;
  INVESTIGATION_CASE_STATE_EVIDENCE_EXPIRED = 9;
}

enum CaseResolution {
  CASE_RESOLUTION_UNSPECIFIED = 0;
  CASE_RESOLUTION_CONFIRMED_MALICIOUS = 1;
  CASE_RESOLUTION_FALSE_POSITIVE = 2;
  CASE_RESOLUTION_BENIGN = 3;
  CASE_RESOLUTION_INSUFFICIENT_EVIDENCE = 4;
  CASE_RESOLUTION_EVIDENCE_DENIED = 5;
  CASE_RESOLUTION_SHADOW_PUBLISHED = 6;
  CASE_RESOLUTION_FAILED = 7;
}

message InvestigationCase {
  string case_id = 1;
  string module_id = 2;
  string asset_id = 3;
  string cluster_id = 4;
  InvestigationCaseState state = 5;
  int32 priority = 6;
  string title = 7;
  string summary = 8;
  repeated yufeng.telemetry.v1.ReviewCandidate representatives = 9;
  yufeng.model.v1.TrafficFinding finding = 10;
  string shadow_release_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string assigned_agent_id = 14;
  string assigned_agent_display_name = 15;
  CaseResolution resolution = 16;
  string automation_suppressed_reason = 17;
  string assigned_run_id = 18;
  string assigned_agent_config_digest = 19;
  google.protobuf.Timestamp resolved_at = 20;
}

enum CaseActivityKind {
  CASE_ACTIVITY_KIND_UNSPECIFIED = 0;
  CASE_ACTIVITY_KIND_CREATED = 1;
  CASE_ACTIVITY_KIND_EVIDENCE_REQUESTED = 2;
  CASE_ACTIVITY_KIND_APPROVAL_DECIDED = 3;
  CASE_ACTIVITY_KIND_RUN_PROGRESS = 4;
  CASE_ACTIVITY_KIND_FINDING = 5;
  CASE_ACTIVITY_KIND_SHADOW_CANDIDATE = 6;
  CASE_ACTIVITY_KIND_RECOMMENDATION = 7;
  CASE_ACTIVITY_KIND_STATE_CHANGED = 8;
  CASE_ACTIVITY_KIND_APPROVAL_REQUESTED = 9;
}

message CaseActivity {
  int64 sequence = 1;
  string case_id = 2;
  CaseActivityKind kind = 3;
  string ref_id = 4;
  string summary = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message ListCasesRequest {
  string asset_id = 1;
  string module_id = 2;
  InvestigationCaseState state = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListCasesResponse {
  repeated InvestigationCase cases = 1;
  string next_page_token = 2;
}

message GetCaseRequest {
  string case_id = 1;
}
message GetCaseResponse {
  InvestigationCase case = 1;
}

message PollCaseActivitiesRequest {
  string case_id = 1;
  int64 after_sequence = 2;
  int32 long_poll_seconds = 3;
}

message PollCaseActivitiesResponse {
  repeated CaseActivity activities = 1;
  int64 next_after_sequence = 2;
}

message ResolveCaseRequest {
  string case_id = 1;
  CaseResolution resolution = 2;
  string note = 3;
}
message ResolveCaseResponse {
  InvestigationCase case = 1;
}

message ReopenCaseRequest {
  string case_id = 1;
  string note = 2;
}
message ReopenCaseResponse {
  InvestigationCase case = 1;
}

message RecordCaseFeedbackRequest {
  string case_id = 1;
  CaseResolution resolution = 2;
  string note = 3;
}
message RecordCaseFeedbackResponse {
  InvestigationCase case = 1;
}
