<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".07"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity=".06"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <marker id="m-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker>
    <marker id="m-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b83"/></marker>
  </defs>

  <rect width="1500" height="1020" fill="#07090d"/>
  <ellipse cx="780" cy="430" rx="540" ry="310" fill="url(#glowC)"/>
  <ellipse cx="240" cy="840" rx="380" ry="230" fill="url(#glowV)"/>

  <!-- header -->
  <text x="50" y="54" font-size="22" font-weight="700" fill="#cdd8e6">御锋 2.0 · 非权威概念图（不约束实现）</text>
  <text x="50" y="80" font-size="13" fill="#8494ab">历史概念示意 · 本图的贾维斯位置与资源箭头已过时 · 进程/协议只认 architecture.md 与 api.md</text>

  <!-- LLM endpoint (external dep, sole egress via modelgateway) -->
  <rect x="60" y="98" width="310" height="64" rx="10" fill="rgba(124,139,161,.04)" stroke="#3d4c61" stroke-dasharray="5 4"/>
  <text x="76" y="122" font-size="12.5" font-weight="600" fill="#cdd8e6">模型端点 · 私有 LLM / OpenAI 兼容</text>
  <text x="76" y="142" font-size="10" fill="#8494ab">仅中台经 modelgateway 调用 · 确定性提供者仅测试编译</text>
  <polyline points="560,192 560,130 378,130" fill="none" stroke="#7c8ba1" stroke-width="1.8" marker-end="url(#m-slate)"/>
  <text x="470" y="122" text-anchor="middle" font-size="9.5" fill="#5a6b83">模型调用 · 唯一出网点</text>

  <!-- human + session contract -->
  <rect x="770" y="92" width="300" height="54" rx="10" fill="rgba(74,222,128,.06)" stroke="#4ade80" stroke-opacity=".5"/>
  <text x="920" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">安全工程师 · 人机回路</text>
  <text x="920" y="134" text-anchor="middle" font-size="10.5" fill="#8494ab">审批 / 对话 / 授权（可经 IM · 邮件送达）</text>
  <line x1="920" y1="146" x2="920" y2="192" stroke="#4ade80" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="932" y="176" font-size="11" fill="#4ade80">⑤ 会话（长轮询）</text>

  <!-- ===== center cluster ===== -->
  <rect x="520" y="196" width="520" height="470" rx="16" fill="#0d1218" stroke="#233246"/>
  <text x="540" y="224" font-size="15" font-weight="700" fill="#38bdf8">中台 · 唯一集成体</text>
  <text x="1020" y="224" text-anchor="end" font-size="10.5" fill="#5a6b83">信任根 · 数据真相 · 人机回路</text>

  <rect x="540" y="240" width="236" height="60" rx="10" fill="#101826" stroke="#1c2635"/>
  <text x="548" y="262" font-size="13" font-weight="600" fill="#cdd8e6">控制台 Console</text>
  <text x="548" y="284" font-size="10.5" fill="#8494ab">态势 · 审批 · 工作台</text>

  <rect x="792" y="240" width="228" height="60" rx="10" fill="rgba(56,189,248,.07)" stroke="#38bdf8" stroke-opacity=".4"/>
  <text x="800" y="262" font-size="13" font-weight="600" fill="#38bdf8">贾维斯 · Orchestrator</text>
  <text x="800" y="284" font-size="10.5" fill="#8494ab">历史布局；现行是 brain 外独立进程，只领研判投影</text>

  <rect x="540" y="316" width="480" height="56" rx="10" fill="#101826" stroke="#1c2635"/>
  <text x="548" y="337" font-size="13" font-weight="600" fill="#a78bfa">治理内核</text>
  <text x="548" y="358" font-size="10.5" fill="#8494ab">制品签名 · 能力令牌 · 凭据保险库 · shadow→canary→审批→回滚 · 审计哈希链</text>

  <rect x="540" y="388" width="480" height="56" rx="10" fill="rgba(96,165,250,.05)" stroke="#23415c"/>
  <text x="548" y="409" font-size="13" font-weight="600" fill="#60a5fa">三本账 PostgreSQL</text>
  <text x="548" y="430" font-size="10.5" fill="#8494ab">事件（不可变）· 资产 · 制品（内容寻址）· 审计链 · pgvector</text>

  <text x="540" y="458" font-size="10" fill="#5a6b83">中台 worker（默认附着 · 可外移）</text>
  <rect x="540" y="466" width="232" height="56" rx="10" fill="#101826" stroke="#1c2635"/>
  <text x="548" y="487" font-size="12.5" font-weight="600" fill="#cdd8e6">情报摄取</text>
  <text x="548" y="507" font-size="10.5" fill="#8494ab">库 / 接口 / OSINT · 溯源入库</text>
  <rect x="788" y="466" width="232" height="56" rx="10" fill="#101826" stroke="#1c2635"/>
  <text x="796" y="487" font-size="12.5" font-weight="600" fill="#cdd8e6">评测 / 回放门禁</text>
  <text x="796" y="507" font-size="10.5" fill="#8494ab">语料回放 · 发布门禁</text>

  <rect x="540" y="544" width="480" height="66" rx="10" fill="rgba(74,222,128,.04)" stroke="#4ade80" stroke-opacity=".55" stroke-dasharray="6 5"/>
  <text x="548" y="566" font-size="13" font-weight="600" fill="#4ade80">Agent 运行时 —— 执行 Agent = 短命 run</text>
  <text x="548" y="586" font-size="10.5" fill="#8494ab">按任务孵化 · 委托书 + 工具包 + 预算 + TTL · 做完即焚</text>
  <text x="548" y="603" font-size="10.5" fill="#8494ab">不可逆动作 → 回治理审批（人机回路）</text>

  <text x="640" y="646" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5a6b83">内部总线 NATS —— 仅中台内部，边缘不接入</text>

  <!-- ===== left: data plane edge ===== -->
  <rect x="60" y="236" width="310" height="330" rx="14" fill="#0d1218" stroke="#233246"/>
  <text x="76" y="264" font-size="14" font-weight="700" fill="#60a5fa">边缘 · 数据面单元</text>
  <text x="76" y="284" font-size="11" fill="#5a6b83">入口机 X（可多台）· 钉在流量路径</text>

  <rect x="76" y="300" width="92" height="22" rx="11" fill="#101826" stroke="#1c2635"/>
  <text x="122" y="315" text-anchor="middle" font-size="10.5" fill="#8494ab">外部流量</text>
  <line x1="168" y1="311" x2="196" y2="311" stroke="#5a6b83" stroke-width="1.5" marker-end="url(#m-slate)"/>

  <rect x="76" y="336" width="278" height="84" rx="10" fill="rgba(96,165,250,.07)" stroke="#60a5fa" stroke-opacity=".4"/>
  <text x="84" y="358" font-size="13" font-weight="600" fill="#60a5fa">yufeng-edge（单二进制）</text>
  <text x="84" y="377" font-size="10.5" fill="#8494ab">同步检测：CRS · 画像（μs 档）</text>
  <text x="84" y="394" font-size="10.5" fill="#8494ab">拦截：反向代理 / ext_authz 配置</text>

  <line x1="215" y1="420" x2="215" y2="442" stroke="#5a6b83" stroke-width="1.5" marker-end="url(#m-slate)"/>
  <rect x="76" y="446" width="278" height="44" rx="10" fill="#101826" stroke="#1c2635"/>
  <text x="215" y="466" text-anchor="middle" font-size="12" fill="#cdd8e6">受保护应用</text>
  <text x="215" y="482" text-anchor="middle" font-size="10" fill="#5a6b83">（上游 · 多实例）</text>

  <rect x="76" y="506" width="278" height="56" rx="8" fill="rgba(251,191,36,.04)" stroke="#fbbf24" stroke-opacity=".55" stroke-dasharray="4 4"/>
  <text x="215" y="524" text-anchor="middle" font-size="10.5" fill="#fbbf24">制品缓存 · 断网自治</text>
  <text x="215" y="540" text-anchor="middle" font-size="10" fill="#8494ab">中台失联 → 继续拦截 · 遥测堆积补传</text>
  <text x="215" y="556" text-anchor="middle" font-size="10" fill="#8494ab">自升级 = 验签制品（免停机）</text>

  <!-- contracts: center <-> data plane edge -->
  <text x="442" y="276" text-anchor="middle" font-size="11" fill="#38bdf8">① 注册</text>
  <line x1="374" y1="286" x2="514" y2="286" stroke="#38bdf8" stroke-width="2" marker-end="url(#m-cyan)"/>
  <text x="442" y="306" text-anchor="middle" font-size="9.5" fill="#5a6b83">心跳 · 能力矩阵</text>

  <text x="442" y="342" text-anchor="middle" font-size="11" fill="#a78bfa">② 制品</text>
  <line x1="516" y1="352" x2="376" y2="352" stroke="#a78bfa" stroke-width="2" marker-end="url(#m-violet)"/>
  <text x="442" y="372" text-anchor="middle" font-size="9.5" fill="#5a6b83">签名规则 / 画像 / 程序</text>

  <text x="442" y="408" text-anchor="middle" font-size="11" fill="#fbbf24">③ 遥测</text>
  <line x1="374" y1="418" x2="514" y2="418" stroke="#fbbf24" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="442" y="438" text-anchor="middle" font-size="9.5" fill="#5a6b83">脱敏事件 · 断网补传</text>

  <!-- external intel sources -->
  <rect x="1130" y="92" width="320" height="150" rx="14" fill="rgba(124,139,161,.03)" stroke="#3d4c61" stroke-dasharray="6 5"/>
  <text x="1146" y="116" font-size="13" font-weight="700" fill="#cdd8e6">外部情报源（三类）</text>
  <text x="1146" y="140" font-size="10.5" fill="#8494ab">情报库 / 数据集：NVD CVE · 商业漏洞库</text>
  <text x="1146" y="160" font-size="10.5" fill="#8494ab">接口 / API：OSV · 厂商 · 订阅源</text>
  <text x="1146" y="180" font-size="10.5" fill="#8494ab">OSINT：PoC 仓库 · 厂商公告 · 社区</text>
  <text x="1146" y="204" font-size="10" fill="#5a6b83">溯源治理：来源锁定 · 许可证 · 入库为情报制品</text>
  <text x="1089" y="202" text-anchor="middle" font-size="9.5" fill="#5a6b83">情报输入（外部）</text>
  <line x1="1126" y1="212" x2="1048" y2="212" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#m-cyan)"/>

  <!-- ===== right: edge-near modelside ===== -->
  <rect x="1130" y="272" width="320" height="180" rx="14" fill="rgba(124,139,161,.03)" stroke="#7c8ba1" stroke-opacity=".6" stroke-dasharray="6 5"/>
  <text x="1146" y="298" font-size="13" font-weight="700" fill="#cdd8e6">Edge 邻近 · 算力 Y（可选）</text>
  <text x="1146" y="322" font-size="12" font-weight="600" fill="#a78bfa">yufeng-modelside</text>
  <text x="1146" y="342" font-size="10.5" fill="#8494ab">接收 Edge 规范化流量 · 有界输入队列</text>
  <text x="1146" y="360" font-size="10.5" fill="#8494ab">签名模型档案 · 本地权重 · 异步推理</text>
  <text x="1146" y="378" font-size="10.5" fill="#8494ab">无 Gate 权限 · 不连 NATS / PostgreSQL / Agent</text>
  <text x="1146" y="398" font-size="10.5" fill="#8494ab">只向 brain 批量上报类型化无原文结果</text>

  <line x1="1126" y1="356" x2="1044" y2="356" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#m-amber)"/>
  <text x="1085" y="374" text-anchor="middle" font-size="9.5" fill="#8494ab">类型化结果上报</text>

  <!-- sandbox: isolated execution -->
  <rect x="1130" y="482" width="320" height="150" rx="14" fill="rgba(248,113,113,.03)" stroke="#f87171" stroke-opacity=".35" stroke-dasharray="6 5"/>
  <text x="1146" y="506" font-size="13" font-weight="700" fill="#cdd8e6">沙箱 · 隔离执行（算力 Z · 可选）</text>
  <text x="1146" y="530" font-size="10.5" fill="#8494ab">PoC 验证 · 提取利用行为签名</text>
  <text x="1146" y="550" font-size="10.5" fill="#8494ab">程序制品 dry-run（发布前门禁）</text>
  <text x="1146" y="570" font-size="10.5" fill="#8494ab">Landlock / seccomp 隔离 · 默认无网</text>
  <text x="1089" y="522" text-anchor="middle" font-size="9.5" fill="#5a6b83">验证任务 ④</text>
  <line x1="1044" y1="532" x2="1126" y2="532" stroke="#f87171" stroke-width="1.8" marker-end="url(#m-red)"/>
  <line x1="1126" y1="588" x2="1044" y2="588" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#m-amber)"/>
  <text x="1089" y="606" text-anchor="middle" font-size="9.5" fill="#5a6b83">行为签名 · 结论 ③</text>

  <!-- contracts: center -> executor zone -->
  <text x="612" y="692" text-anchor="end" font-size="10.5" fill="#a78bfa">② 制品（程序）</text>
  <line x1="620" y1="670" x2="620" y2="704" stroke="#a78bfa" stroke-width="2" marker-end="url(#m-violet)"/>

  <line x1="780" y1="610" x2="780" y2="704" stroke="#f87171" stroke-width="2" marker-end="url(#m-red)"/>
  <text x="792" y="692" font-size="10.5" fill="#f87171">④ 指令 · 逐步回执 · 可中止</text>

  <line x1="900" y1="704" x2="900" y2="670" stroke="#fbbf24" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="912" y="692" font-size="10.5" fill="#fbbf24">③ 遥测（传感）</text>

  <!-- ===== bottom: executor zone ===== -->
  <rect x="200" y="712" width="1140" height="222" rx="14" fill="rgba(13,18,24,.55)" stroke="#1c2635" stroke-dasharray="7 6"/>
  <text x="220" y="738" font-size="13" font-weight="700" fill="#cdd8e6">边缘 · 执行单元 —— 被保护资产的三种接入模式</text>
  <text x="1320" y="738" text-anchor="end" font-size="10.5" fill="#5a6b83">同一 RepairPlan · 同一程序制品 · 只是通道不同</text>

  <rect x="240" y="756" width="330" height="156" rx="10" fill="#101826" stroke="#23415c"/>
  <text x="256" y="780" font-size="12.5" font-weight="700" fill="#4ade80">embedded · 在机</text>
  <text x="256" y="804" font-size="11" font-weight="600" fill="#cdd8e6">yufeng-host（单二进制）</text>
  <text x="256" y="824" font-size="10.5" fill="#8494ab">原语执行器 · 传感器（sys.probe）</text>
  <text x="256" y="842" font-size="10.5" fill="#8494ab">制品缓存 · 断网降级 · 自升级 = 验签制品</text>
  <rect x="256" y="858" width="298" height="36" rx="8" fill="rgba(74,222,128,.05)" stroke="#4ade80" stroke-opacity=".3"/>
  <text x="405" y="881" text-anchor="middle" font-size="10.5" fill="#4ade80">可用面：L1 · L2 全链 · L3 本地原语</text>

  <rect x="600" y="756" width="330" height="156" rx="10" fill="#101826" stroke="#fbbf24" stroke-opacity=".35"/>
  <text x="616" y="780" font-size="12.5" font-weight="700" fill="#fbbf24">remote · 可达（免代理）</text>
  <text x="616" y="804" font-size="11" font-weight="600" fill="#cdd8e6">SSH / 厂商 API 适配器</text>
  <text x="616" y="824" font-size="10.5" fill="#8494ab">设备上不装任何程序</text>
  <text x="616" y="842" font-size="10.5" fill="#8494ab">能力探针与原语经通道执行</text>
  <rect x="616" y="858" width="298" height="36" rx="8" fill="rgba(251,191,36,.05)" stroke="#fbbf24" stroke-opacity=".3"/>
  <text x="765" y="881" text-anchor="middle" font-size="10.5" fill="#fbbf24">可用面：L2 部分 · L3 远程原语</text>

  <rect x="960" y="756" width="330" height="156" rx="10" fill="#101826" stroke="#3d4c61"/>
  <text x="976" y="780" font-size="12.5" font-weight="700" fill="#7c8ba1">network · 旁路</text>
  <text x="976" y="804" font-size="11" font-weight="600" fill="#cdd8e6">哑设备（摄像头 · IoT · 打印机）</text>
  <text x="976" y="824" font-size="10.5" fill="#8494ab">设备无感知 · 镜像 SPAN 可作感知源</text>
  <text x="976" y="842" font-size="10.5" fill="#8494ab">由入口的数据面单元代理保护</text>
  <rect x="976" y="858" width="298" height="36" rx="8" fill="rgba(124,139,161,.05)" stroke="#7c8ba1" stroke-opacity=".3"/>
  <text x="1125" y="881" text-anchor="middle" font-size="10.5" fill="#7c8ba1">可用面：仅 L1 + 被动感知 · 引导升级接入</text>

  <!-- footer -->
  <rect x="50" y="958" width="10" height="10" rx="2" fill="#38bdf8"/><text x="66" y="968" font-size="11" fill="#8494ab">① 注册</text>
  <rect x="130" y="958" width="10" height="10" rx="2" fill="#a78bfa"/><text x="146" y="968" font-size="11" fill="#8494ab">② 制品</text>
  <rect x="210" y="958" width="10" height="10" rx="2" fill="#fbbf24"/><text x="226" y="968" font-size="11" fill="#8494ab">③ 遥测</text>
  <rect x="290" y="958" width="10" height="10" rx="2" fill="#f87171"/><text x="306" y="968" font-size="11" fill="#8494ab">④ 指令</text>
  <rect x="370" y="958" width="10" height="10" rx="2" fill="#4ade80"/><text x="386" y="968" font-size="11" fill="#8494ab">⑤ 会话</text>
  <text x="470" y="968" font-size="10.5" fill="#5a6b83">（虚线框 = 可选 / 独立分布单元）</text>
  <text x="1450" y="968" text-anchor="end" font-size="11" fill="#8494ab">铁律：智能在中台 · 设备上只有哑执行器 —— Agent 不在数据路径上</text>
  <text x="50" y="992" font-size="10.5" fill="#5a6b83">更新节奏：原语（平台发版 · 年级）→ 工具 / 程序制品（热更新 · 周月级）→ 技能提示词（制品 · 天级）；执行 Agent 是短命 run 脱离常驻；中台可加副本（共享 PG / 信任根），入口机与资产均可 ×N</text>
</svg>
