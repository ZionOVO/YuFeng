name: software-release

on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: 仅恢复中断发布时填写原始工作流运行标识；留空会执行唯一一次构建
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: software-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select a fresh main commit or the original immutable bundle source
        env:
          REQUESTED_BUNDLE_RUN: ${{ inputs.bundle_run_id }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          source_commit=""
          effective_run="$GITHUB_RUN_ID"
          recovery=false
          if [ -n "$REQUESTED_BUNDLE_RUN" ]; then
            [[ "$REQUESTED_BUNDLE_RUN" =~ ^[0-9]+$ ]]
            test "$REQUESTED_BUNDLE_RUN" != "$GITHUB_RUN_ID"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_BUNDLE_RUN}" > "$RUNNER_TEMP/source-run.json"
            test "$(jq -r '.repository.full_name' "$RUNNER_TEMP/source-run.json")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.path' "$RUNNER_TEMP/source-run.json")" = ".github/workflows/release.yml"
            test "$(jq -r '.event' "$RUNNER_TEMP/source-run.json")" = "workflow_dispatch"
            test "$(jq -r '.head_branch' "$RUNNER_TEMP/source-run.json")" = "main"
            test "$(jq -r '.status' "$RUNNER_TEMP/source-run.json")" = "completed"
            source_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/source-run.json")"
            git cat-file -e "${source_commit}^{commit}"
            git checkout --detach "$source_commit"
            effective_run="$REQUESTED_BUNDLE_RUN"
            recovery=true
          else
            source_commit="$(git rev-parse HEAD)"
            test "$source_commit" = "$GITHUB_SHA"
            test "$source_commit" = "$(git rev-parse origin/main)"
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          plain_version="${version#v}"
          test "$plain_version" = "$(node -p "require('./console/package.json').version")"
          test "$plain_version,$plain_version" = "$(node -p "[require('./console/package-lock.json').version, require('./console/package-lock.json').packages[''].version].join(',')")"
          test "$plain_version" = "$(python3 -c 'import tomllib; print(tomllib.load(open("components/modelside/pyproject.toml", "rb"))["project"]["version"])')"
          test "$plain_version" = "$(python3 -c 'import sys; sys.path.insert(0, "components/modelside"); import yufeng_modelside; print(yufeng_modelside.__version__)')"

          successful_ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=${source_commit}&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_ci" -ge 1
          if [ "$recovery" = false ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
              echo "release tag already exists: $version" >&2
              exit 1
            fi
            if gh release view "$version" >/dev/null 2>&1; then
              echo "release already exists: $version" >&2
              exit 1
            fi
          fi

          echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "BUNDLE_RUN_ID=$effective_run" >> "$GITHUB_ENV"
          echo "RECOVERY=$recovery" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=$RUNNER_TEMP/release-bundle" >> "$GITHUB_ENV"
          echo "STORED_BUNDLE_DIR=$RUNNER_TEMP/stored-release-bundle" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build and seal the software artifact set exactly once
        if: inputs.bundle_run_id == ''
        run: ./scripts/build-release-assets.sh "$BUNDLE_DIR"

      - name: Download the original immutable bundle without rebuilding
        if: inputs.bundle_run_id != ''
        run: gh run download "$BUNDLE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "yufeng-$RELEASE_TAG-release-bundle" --dir "$BUNDLE_DIR"

      - name: Validate the exact files before storing or publishing them
        env:
          RELEASE_SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          RELEASE_WORKFLOW_RUN: ${{ env.BUNDLE_RUN_ID }}
        run: ./scripts/verify-release-assets.sh "$BUNDLE_DIR"

      - name: Store the immutable release bundle before creating a tag
        if: inputs.bundle_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: yufeng-${{ env.RELEASE_TAG }}-release-bundle
          path: ${{ env.BUNDLE_DIR }}/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90

      - name: Download the just-stored workflow bundle to a new directory
        if: inputs.bundle_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: yufeng-${{ env.RELEASE_TAG }}-release-bundle
          path: ${{ env.STORED_BUNDLE_DIR }}

      - name: Prove the workflow bundle is byte-identical
        if: inputs.bundle_run_id == ''
        run: |
          set -euo pipefail
          expected="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -exec basename {} \; | sort)"
          actual="$(find "$STORED_BUNDLE_DIR" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$expected" = "$actual"
          while IFS= read -r asset; do
            cmp "$BUNDLE_DIR/$asset" "$STORED_BUNDLE_DIR/$asset"
          done <<< "$expected"
          RELEASE_WORKFLOW_RUN="$BUNDLE_RUN_ID" python3 scripts/release-artifacts.py verify \
            --directory "$STORED_BUNDLE_DIR" --version "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" --workflow-run "$BUNDLE_RUN_ID"

      - name: Create or verify the annotated tag after bundle preservation
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [ -z "$remote_refs" ]; then
            manifest_sha="$(sha256sum "$BUNDLE_DIR/yufeng-$RELEASE_TAG-release-manifest.json" | awk '{print $1}')"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf -v tag_message 'YuFeng %s software release\n\nsource-commit=%s\nworkflow-run=%s\nmanifest-sha256=%s' \
              "$RELEASE_TAG" "$SOURCE_COMMIT" "$BUNDLE_RUN_ID" "$manifest_sha"
            git tag -a "$RELEASE_TAG" "$SOURCE_COMMIT" -m "$tag_message"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            test "$RECOVERY" = "true"
            tag_object="$(awk '$2 !~ /\^\{\}$/ {print $1}' <<< "$remote_refs")"
            tag_commit="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "$remote_refs")"
            test -n "$tag_object"
            test "$tag_commit" = "$SOURCE_COMMIT"
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/release-verify-$GITHUB_RUN_ID"
            test "$(git cat-file -t "refs/tags/release-verify-$GITHUB_RUN_ID")" = "tag"
          fi

      - name: Create or resume the Draft Release without overwriting assets
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '# YuFeng %s\n\nSource commit: `%s`\n\nThe release manifest is the authority for this fixed software artifact set. Deployment qualification is recorded separately.\n' \
            "$RELEASE_TAG" "$SOURCE_COMMIT" > "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$RECOVERY" = "true"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes"
          fi

          expected_assets="$RUNNER_TEMP/expected-assets.txt"
          existing_assets="$RUNNER_TEMP/existing-assets.txt"
          find "$BUNDLE_DIR" -maxdepth 1 -type f -exec basename {} \; | sort > "$expected_assets"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > "$existing_assets"
          if comm -13 "$expected_assets" "$existing_assets" | grep -q .; then
            echo "Draft Release contains an unexpected asset" >&2
            comm -13 "$expected_assets" "$existing_assets" >&2
            exit 1
          fi

          existing_dir="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing_dir"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing_dir"
            cmp "$BUNDLE_DIR/$asset" "$existing_dir/$asset"
          done < "$existing_assets"
          while IFS= read -r asset; do
            if ! grep -Fxq "$asset" "$existing_assets"; then
              gh release upload "$RELEASE_TAG" "$BUNDLE_DIR/$asset"
            fi
          done < "$expected_assets"

      - name: Redownload and verify every Draft Release byte
        env:
          RELEASE_SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          RELEASE_WORKFLOW_RUN: ${{ env.BUNDLE_RUN_ID }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/downloaded-release-assets"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          expected="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -exec basename {} \; | sort)"
          actual="$(find "$downloaded" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$expected" = "$actual"
          while IFS= read -r asset; do
            cmp "$BUNDLE_DIR/$asset" "$downloaded/$asset"
          done <<< "$expected"
          ./scripts/verify-release-assets.sh "$downloaded"

      - name: Publish the verified Release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
