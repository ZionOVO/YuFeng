name: tagged-release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_version:
        description: VERSION 中已创建 Draft Release 的注解标签
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: tagged-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_version }}
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the VERSION annotation and increasing semantic version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "$(tr -d '[:space:]' < VERSION)"
          # checkout 会把本地标签引用改写为剥离后的提交，注解标签必须通过远端的标签对象与剥离引用共同确认。
          remote_tag_refs="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_tag_object="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_tag_refs")"
          remote_tag_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_tag_refs")"
          test -n "$remote_tag_object"
          test "$remote_tag_commit" = "$GITHUB_SHA"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/release-evidence-${GITHUB_RUN_ID}"
          git for-each-ref --format='%(contents)' "refs/tags/release-evidence-${GITHUB_RUN_ID}" > "$RUNNER_TEMP/release-tag-message.txt"
          previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')"
          if [ -n "$previous_tag" ]; then
            greatest_tag="$(printf '%s\n%s\n' "$previous_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
            test "$greatest_tag" = "$RELEASE_TAG"
          fi
      - name: Require the current main merge of the evidenced develop commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main develop
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          read -r -a parents <<<"$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          test "${#parents[@]}" -eq 3
          develop_parent="${parents[2]}"
          git merge-base --is-ancestor "$develop_parent" origin/develop
          read -r -a evidence_parents <<<"$(git rev-list --parents -n 1 "$develop_parent")"
          test "${#evidence_parents[@]}" -eq 3
          test "$(git rev-parse "${evidence_parents[2]}^{tree}")" = "$(git rev-parse "${develop_parent}^{tree}")"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=develop&event=push&head_sha=${develop_parent}&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "develop continuous integration has not succeeded for ${develop_parent}" >&2
            exit 1
          fi
          python3 scripts/release-metadata.py verify \
            --file "$RUNNER_TEMP/release-tag-message.txt" \
            --expected-version "$RELEASE_TAG" \
            --expected-commit "$develop_parent" \
            --expected-tree "$(git rev-parse "${develop_parent}^{tree}")"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build Linux release binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release/linux-amd64/bin release/linux-arm64/bin release/linux-mips/bin \
            release/windows-amd64/bin release/darwin-amd64/bin release/darwin-arm64/bin
          built_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          linker_flags="-X main.version=${RELEASE_TAG} -X main.sha=${GITHUB_SHA} -X main.builtAt=${built_at}"
          commands=(yfctl yufeng-agentd yufeng-brain yufeng-dataplane yufeng-edge yufeng-host yufeng-jarvis yufeng-run)
          for command in "${commands[@]}"; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$linker_flags" -o "release/linux-amd64/bin/${command}" "./cmd/${command}"
          done
          for architecture in arm64 mips; do
            for command in yufeng-edge yufeng-host; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$architecture" go build -trimpath -ldflags "$linker_flags" -o "release/linux-${architecture}/bin/${command}" "./cmd/${command}"
            done
          done
          for command in yufeng-jarvis yufeng-agentd yufeng-run; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$linker_flags" -o "release/linux-arm64/bin/${command}" "./cmd/${command}"
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$linker_flags" -o "release/windows-amd64/bin/${command}.exe" "./cmd/${command}"
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$linker_flags" -o "release/darwin-amd64/bin/${command}" "./cmd/${command}"
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$linker_flags" -o "release/darwin-arm64/bin/${command}" "./cmd/${command}"
          done
      - name: Build console release
        run: |
          npm ci
          npm run build
        working-directory: console
      - name: Add native service installers and ModelSide Python package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for directory in linux-amd64 linux-arm64 windows-amd64 darwin-amd64 darwin-arm64; do
            mkdir -p "release/${directory}/agentd"
            cp deploy/agentd/README.md "release/${directory}/agentd/"
          done
          cp deploy/agentd/install-linux.sh release/linux-amd64/agentd/
          cp deploy/agentd/install-linux.sh release/linux-arm64/agentd/
          cp deploy/agentd/install-macos.sh release/darwin-amd64/agentd/
          cp deploy/agentd/install-macos.sh release/darwin-arm64/agentd/
          cp deploy/agentd/Install-Windows.ps1 release/windows-amd64/agentd/
          chmod +x release/linux-amd64/agentd/install-linux.sh release/linux-arm64/agentd/install-linux.sh \
            release/darwin-amd64/agentd/install-macos.sh release/darwin-arm64/agentd/install-macos.sh
          for directory in linux-amd64 linux-arm64 linux-mips; do
            mkdir -p "release/${directory}/edge"
            cp deploy/edge/README.md deploy/edge/edge.env.example deploy/edge/yufeng-edge.service \
              deploy/edge/install-linux.sh "release/${directory}/edge/"
            chmod +x "release/${directory}/edge/install-linux.sh"
          done
          mkdir -p release/modelside-python/wheels release/modelside-python/service release/deployment
          python3 -m pip wheel --no-deps --wheel-dir release/modelside-python/wheels components/modelside
          test "${RELEASE_TAG#v}" = "$(python3 -c 'import tomllib; print(tomllib.load(open("components/modelside/pyproject.toml", "rb"))["project"]["version"])')"
          cp components/modelside/README.md release/modelside-python/
          cp deploy/modelside/README.md deploy/modelside/modelside.env.example deploy/modelside/yufeng-modelside.service \
            release/modelside-python/service/
          cp deploy/compose.yaml deploy/compose.edge-modelside.yaml deploy/.env.example deploy/README.md release/deployment/
          cp -R deploy/edge deploy/modelside deploy/secrets release/deployment/
      - name: Build deliverable Edge and ModelSide container images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          built_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          docker build --platform linux/amd64 \
            --build-arg VERSION="$RELEASE_TAG" --build-arg SHA="$GITHUB_SHA" --build-arg BUILT_AT="$built_at" \
            -f deploy/edge.Dockerfile -t "yufeng-edge:${RELEASE_TAG}" .
          docker build --platform linux/amd64 \
            --build-arg VERSION="$RELEASE_TAG" --build-arg SHA="$GITHUB_SHA" --build-arg BUILT_AT="$built_at" \
            -f components/modelside/Dockerfile -t "yufeng-modelside:${RELEASE_TAG}" .
          docker save "yufeng-edge:${RELEASE_TAG}" | gzip -n > "release/yufeng-${RELEASE_TAG}-edge-image-linux-amd64.tar.gz"
          docker save "yufeng-modelside:${RELEASE_TAG}" | gzip -n > "release/yufeng-${RELEASE_TAG}-modelside-image-linux-amd64.tar.gz"
      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp -R console/dist release/console
          for directory in linux-amd64 linux-arm64 linux-mips windows-amd64 darwin-amd64 darwin-arm64 console modelside-python deployment; do
            tar -czf "release/yufeng-${RELEASE_TAG}-${directory}.tar.gz" -C release "$directory"
          done
          cd release
          sha256sum ./*.tar.gz > "yufeng-${RELEASE_TAG}-checksums.txt"
      - name: Create or refresh the Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" release/*.tar.gz release/*-checksums.txt --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-tag-message.txt"
          else
            gh release create "$RELEASE_TAG" release/*.tar.gz release/*-checksums.txt \
              --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-tag-message.txt"
          fi

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_version }}
      - name: Recheck VERSION, annotation, main and evidenced develop parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "$(tr -d '[:space:]' < VERSION)"
          git fetch origin main develop
          remote_tag_refs="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_tag_object="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_tag_refs")"
          release_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_tag_refs")"
          test -n "$remote_tag_object"
          test "$release_commit" = "$(git rev-parse origin/main)"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/release-publish-${GITHUB_RUN_ID}"
          git for-each-ref --format='%(contents)' "refs/tags/release-publish-${GITHUB_RUN_ID}" > "$RUNNER_TEMP/release-tag-message.txt"
          read -r -a parents <<<"$(git rev-list --parents -n 1 "$release_commit")"
          test "${#parents[@]}" -eq 3
          develop_parent="${parents[2]}"
          git merge-base --is-ancestor "$develop_parent" origin/develop
          read -r -a evidence_parents <<<"$(git rev-list --parents -n 1 "$develop_parent")"
          test "${#evidence_parents[@]}" -eq 3
          evidence_base_parent="${evidence_parents[1]}"
          evidence_source_parent="${evidence_parents[2]}"
          test "$(git rev-parse "${evidence_source_parent}^{tree}")" = "$(git rev-parse "${develop_parent}^{tree}")"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=develop&event=push&head_sha=${develop_parent}&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          test "$conclusion" = "success"
          python3 scripts/release-metadata.py verify \
            --file "$RUNNER_TEMP/release-tag-message.txt" \
            --expected-version "$RELEASE_TAG" \
            --expected-commit "$develop_parent" \
            --expected-tree "$(git rev-parse "${develop_parent}^{tree}")"
          evidence_sha256="$(python3 scripts/release-metadata.py get --file "$RUNNER_TEMP/release-tag-message.txt" --field evidence-sha256)"
          echo "EVIDENCE_COMMIT=${develop_parent}" >> "$GITHUB_ENV"
          echo "EVIDENCE_TREE=$(git rev-parse "${develop_parent}^{tree}")" >> "$GITHUB_ENV"
          echo "EVIDENCE_SHA256=${evidence_sha256}" >> "$GITHUB_ENV"
          echo "EVIDENCE_BASE_PARENT=${evidence_base_parent}" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE_PARENT=${evidence_source_parent}" >> "$GITHUB_ENV"
      - name: Require the exact Draft Release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-body.txt"
          python3 scripts/release-metadata.py verify \
            --file "$RUNNER_TEMP/release-body.txt" \
            --expected-version "$RELEASE_TAG" \
            --expected-commit "$EVIDENCE_COMMIT" \
            --expected-tree "$EVIDENCE_TREE" \
            --expected-sha256 "$EVIDENCE_SHA256" \
            --expected-base-commit "$EVIDENCE_BASE_PARENT" \
            --expected-source-commit "$EVIDENCE_SOURCE_PARENT"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          expected_assets=(
            "yufeng-${RELEASE_TAG}-linux-amd64.tar.gz"
            "yufeng-${RELEASE_TAG}-linux-arm64.tar.gz"
            "yufeng-${RELEASE_TAG}-linux-mips.tar.gz"
            "yufeng-${RELEASE_TAG}-windows-amd64.tar.gz"
            "yufeng-${RELEASE_TAG}-darwin-amd64.tar.gz"
            "yufeng-${RELEASE_TAG}-darwin-arm64.tar.gz"
            "yufeng-${RELEASE_TAG}-console.tar.gz"
            "yufeng-${RELEASE_TAG}-modelside-python.tar.gz"
            "yufeng-${RELEASE_TAG}-deployment.tar.gz"
            "yufeng-${RELEASE_TAG}-edge-image-linux-amd64.tar.gz"
            "yufeng-${RELEASE_TAG}-modelside-image-linux-amd64.tar.gz"
            "yufeng-${RELEASE_TAG}-checksums.txt"
            "yufeng-${RELEASE_TAG}-live-evidence.tar.gz"
            "yufeng-${RELEASE_TAG}-live-evidence.tar.gz.sha256"
            "yufeng-${RELEASE_TAG}-live-evidence.json"
          )
          printf '%s\n' "${expected_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "yufeng-${RELEASE_TAG}-checksums.txt")
      - name: Recheck the uploaded live evidence archive
        run: |
          assets="$RUNNER_TEMP/release-assets"
          python3 scripts/release-evidence.py verify \
            --manifest "$assets/yufeng-${RELEASE_TAG}-live-evidence.json" \
            --archive "$assets/yufeng-${RELEASE_TAG}-live-evidence.tar.gz" \
            --checksum "$assets/yufeng-${RELEASE_TAG}-live-evidence.tar.gz.sha256" \
            --expected-version "$RELEASE_TAG" \
            --expected-commit "$EVIDENCE_COMMIT" \
            --expected-tree "$EVIDENCE_TREE" \
            --expected-sha256 "$EVIDENCE_SHA256"
      - name: Publish the verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
