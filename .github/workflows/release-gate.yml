name: main-release-gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: main-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository develop branch
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ] || [ "$HEAD_REF" != "develop" ]; then
            echo "main only accepts the repository develop branch" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main to contain no changes outside develop
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if ! git diff --quiet "$merge_base" "$BASE_SHA"; then
            echo "main contains changes outside the shared develop baseline" >&2
            exit 1
          fi
      - name: Require successful develop integration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=develop&event=push&head_sha=${HEAD_SHA}&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "develop continuous integration has not succeeded for ${HEAD_SHA}" >&2
            exit 1
          fi
      - name: Require exact passed release evidence metadata
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/release-body.txt"
          evidence_tree=$(python3 scripts/release-metadata.py get --file "$RUNNER_TEMP/release-body.txt" --field evidence-tree)
          head_tree=$(git rev-parse "${HEAD_SHA}^{tree}")
          test "$evidence_tree" = "$head_tree"
          python3 scripts/release-metadata.py verify \
            --file "$RUNNER_TEMP/release-body.txt" \
            --expected-version "$(tr -d '[:space:]' < VERSION)" \
            --expected-commit "$HEAD_SHA" \
            --expected-tree "$head_tree"
