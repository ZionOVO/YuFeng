name: development-platform-compatibility

# 合并门禁固定在 Ubuntu 24.04；需要排查平台差异时才人工运行本工作流，不阻断 main。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-platform-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-22.04
          - name: windows-2022
            os: windows-2022
          - name: macos-15-intel
            os: macos-15-intel
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Check platform packages with one Go build worker
        if: runner.os != 'Windows'
        run: make build test vet GO_TEST_FLAGS='-p=1'
      - name: Check platform packages with one Go build worker on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\development-check.ps1 -Parallelism 1
