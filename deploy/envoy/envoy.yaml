static_resources:
  listeners:
    - name: protected_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: protected_http
                use_remote_address: true
                generate_request_id: true
                preserve_external_request_id: false
                route_config:
                  name: application_routes
                  virtual_hosts:
                    - name: application
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: application
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      stat_prefix: yufeng
                      http_service:
                        server_uri:
                          uri: http://yufeng-edge-local:18081
                          cluster: yufeng_external_authorization
                          timeout: 0.1s
                      failure_mode_allow: false
                      status_on_error:
                        code: ServiceUnavailable
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: true
                      allowed_headers:
                        patterns:
                          - exact: content-type
                          - exact: x-forwarded-for
                          - exact: x-forwarded-proto
                          - exact: x-request-id
                      disallowed_headers:
                        patterns:
                          - exact: authorization
                          - exact: cookie
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: yufeng_external_authorization
      type: STRICT_DNS
      connect_timeout: 0.05s
      load_assignment:
        cluster_name: yufeng_external_authorization
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: yufeng-edge-local
                      port_value: 18081
    - name: application
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: application
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: application
                      port_value: 8080
