name: yufeng-envoy-integration

services:
  envoy:
    image: ${YUFENG_ENVOY_IMAGE:-envoyproxy/envoy:v1.38.0}
    entrypoint: ["/usr/local/bin/envoy"]
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:${YUFENG_ENVOY_PORT:-10000}:10000"
    depends_on:
      - yufeng-authz
      - application

  yufeng-authz:
    image: yufeng-envoy-fixture:local
    build:
      context: ../..
      dockerfile: deploy/envoy/testdata/Dockerfile
    command: ["-mode", "authz", "-addr", ":18081"]
    read_only: true
    networks:
      default:
        aliases:
          - yufeng-edge-local

  application:
    image: yufeng-envoy-fixture:local
    build:
      context: ../..
      dockerfile: deploy/envoy/testdata/Dockerfile
    command: ["-mode", "application", "-addr", ":8080"]
    read_only: true
